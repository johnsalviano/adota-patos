<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área da Equipe | Adota Patos</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="caixa-login">
        <div class="logo">🐾 Adota Patos</div>
        <p class="subtitulo">Área restrita para a equipe da ONG</p>

        <div id="mensagem-erro" class="mensagem-erro" role="alert"></div>

        <form id="formulario-login" autocomplete="on">
            <div class="form-group">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" required
                       autocomplete="email"
                       maxlength="100"
                       placeholder="voce@adotapatos.org">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required
                       autocomplete="current-password"
                       maxlength="80"
                       placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="botao-entrar">Entrar</button>
        </form>

        <div class="voltar-site">
            <a href="../index.html">← Voltar ao site público</a>
        </div>

        <div class="aviso-equipe">
            Acesso exclusivo de voluntários e coordenadores autorizados.
            Se você é adotante, não precisa entrar: o formulário do site é aberto.
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
