<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área da Equipe | Adota Patos</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
    <style>
        :root {
            --primary: #57d8c3;
            --primary-dark: #29a794;
            --primary-light: #a9eee1;
            --secondary: #ffffe3;
            --gold: #f5c567;
            --gold-dark: #dfa634;
            --dark: #16332e;
            --text: #55655f;
            --white: #ffffff;
            --gray: #fbfbea;
            --radius-lg: 28px;
            --radius-md: 18px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--gray);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .caixa-login {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 40px rgba(22, 51, 46, 0.10);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .subtitulo {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark);
            font-size: 0.92rem;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e2ece9;
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: border-color 0.2s;
            background: var(--secondary);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--white);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--dark);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: var(--primary-light); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: wait; }

        .mensagem-erro {
            display: none;
            background: #fde8e8;
            color: #b02a37;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .voltar-site {
            text-align: center;
            margin-top: 26px;
            font-size: 0.88rem;
        }

        .voltar-site a { color: var(--text); }

        .aviso-equipe {
            background: #fff8e7;
            border-left: 4px solid var(--gold);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--text);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <main class="caixa-login">
        <div class="logo">🐾 Adota Patos</div>
        <p class="subtitulo">Área restrita para a equipe da ONG</p>

        <div id="mensagem-erro" class="mensagem-erro" role="alert"></div>

        <form id="formulario-login" autocomplete="on">
            <div class="form-group">
                <label for="email">E-mail cadastrado</label>
                <input type="email" id="email" required
                       autocomplete="email"
                       maxlength="100"
                       placeholder="voce@adotapatos.org">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required
                       autocomplete="current-password"
                       maxlength="80"
                       placeholder="Sua senha de acesso">
            </div>

            <button type="submit" id="botao-entrar">Entrar</button>
        </form>

        <div class="voltar-site">
            <a href="../index.html">← Voltar ao site público</a>
        </div>

        <div class="aviso-equipe">
            Acesso exclusivo de voluntários e coordenadores autorizados.
            Se você é adotante, não precisa entrar: o formulário do site é aberto.
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Mesmas credenciais publicas do site: seguranca real vem da RLS
        const cliente = window.supabase.createClient(
            'https://fnlqruzbgwffhrqmpfvi.supabase.co',
            'sb_publishable_jLvZpI_9Kg97Yqg6sdOzrQ_9gvAmRIR'
        );

        const form = document.getElementById('formulario-login');
        const erro = document.getElementById('mensagem-erro');
        const botao = document.getElementById('botao-entrar');

        function mostrarErro(texto) {
            erro.textContent = texto;
            erro.style.display = 'block';
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            erro.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            botao.disabled = true;
            botao.textContent = 'Verificando...';

            try {
                // 1. Autentica com e-mail e senha
                const { data, error } = await cliente.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (error) {
                    mostrarErro('E-mail ou senha incorretos. Confira e tente novamente.');
                    return;
                }

                // 2. So entra quem esta na lista autorizada da ONG
                const { data: membro, error: erroMembro } = await cliente
                    .rpc('eh_membro_ong');

                if (erroMembro || !membro) {
                    // Conta existe, mas nao foi autorizada pela ONG:
                    // encerra a sessao imediatamente.
                    await cliente.auth.signOut();
                    mostrarErro('Esta conta não tem permissão de acesso à equipe.');
                    return;
                }

                // 3. Membro confirmado: segue para o painel
                window.location.href = 'painel.html';

            } catch (falha) {
                mostrarErro('Não foi possível conectar agora. Tente novamente em instantes.');
            } finally {
                botao.disabled = false;
                botao.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
