name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # O id do job e o nome do check exigido pela protecao da main.
  # Garante a separacao de linguagens (SoC): HTML e so estrutura,
  # sem estilo, script ou evento inline. CSS e JS vivem em arquivos.
  estrutura-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Proibe CSS, JS e eventos inline nos HTML de producao
        run: |
          ARQUIVOS_HTML="frontend/index.html frontend/admin/*.html"
          if grep -nE '<style|style[[:space:]]*=|on(click|input|change|submit|focus|blur|load|keydown|keyup|mouseenter|mouseover|dblclick|error|scroll)[[:space:]]*=' $ARQUIVOS_HTML; then
            echo "::error::HTML com estilo, script ou evento inline. Separe estrutura (HTML), apresentacao (CSS) e comportamento (JS)."
            exit 1
          fi
          # JSON-LD (application/ld+json) e permitido como dado estruturado — so proibe <script> com JS inline
          if grep -Pn '<script(?![^>]*\bsrc[[:space:]]*=)' $ARQUIVOS_HTML | grep -v 'type="application/ld+json"'; then
            echo "::error::Tag <script> sem src (JS inline). Mova o codigo para frontend/js/."
            exit 1
          fi
          # SoC tambem vale no JS: nada de manipular estilo diretamente.
          # Toda mudanca visual via classes definidas no CSS.
          if grep -nE '\.style\.[a-zA-Z]+|[.]style[[:space:]]*[=]|style\.cssText|setAttribute\([\x27\x22]style' frontend/js/app.js frontend/admin/*.js; then
            echo "::error::JS manipulando estilo diretamente (inline). Use classes CSS."
            exit 1
          fi
          echo "OK: HTML e JS de producao sem estilo, script ou evento inline."