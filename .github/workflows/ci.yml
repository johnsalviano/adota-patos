name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # O id do job e o nome do check exigido pela protecao da main.
  # Garante a separacao de linguagens (SoC): HTML e so estrutura,
  # sem estilo, script ou evento inline. CSS e JS vivem em arquivos.
  estrutura-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Proibe CSS, JS e eventos inline nos HTML de producao
        run: |
          ARQUIVOS="frontend/index.html frontend/admin/*.html"
          if grep -nE '<style|style[[:space:]]*=|on(click|input|change|submit|focus|blur|load|keydown|keyup|mouseenter|mouseover|dblclick|error|scroll)[[:space:]]*=' $ARQUIVOS; then
            echo "::error::HTML com estilo, script ou evento inline. Separe estrutura (HTML), apresentacao (CSS) e comportamento (JS)."
            exit 1
          fi
          if grep -Pn '<script(?![^>]*\bsrc[[:space:]]*=)' $ARQUIVOS; then
            echo "::error::Tag <script> sem src (JS inline). Mova o codigo para frontend/js/."
            exit 1
          fi
          echo "OK: HTML de producao sem estilo, script ou evento inline."