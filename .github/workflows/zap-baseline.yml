name: OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Weekly on Monday at 05:00 UTC

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://johnsalviano.github.io/adota-patos/"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-html-report
          path: report_html.html
          retention-days: 30

      - name: Upload ZAP JSON Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-json-report
          path: report_json.json
          retention-days: 30

      - name: Upload ZAP Markdown Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-baseline-md-report
          path: report_md.md
          retention-days: 30

      - name: Check for Alerts
        if: always()
        run: |
          if [ -f report_json.json ]; then
            ALERTS=$(jq '.site[0].alerts | length' report_json.json 2>/dev/null || echo 0)
            echo "Total alerts found: $ALERTS"
            if [ "$ALERTS" -gt 0 ]; then
              echo "::warning::OWASP ZAP found $ALERTS alerts. Check the artifacts for details."
            else
              echo "No alerts found by OWASP ZAP Baseline Scan."
            fi
          else
            echo "No report_json.json found."
          fi