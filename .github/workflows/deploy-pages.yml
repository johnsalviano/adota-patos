name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test pos-deploy
        run: |
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" "${{ steps.deployment.outputs.page_url }}"