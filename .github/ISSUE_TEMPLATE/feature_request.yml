name: ✨ Melhoria ou função nova
description: Sugerir uma melhoria no que existe ou propor algo novo
labels: [melhoria]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve?
      description: Conte o cenário real — para a ONG, para quem adota ou para o site.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Solução proposta
      description: Como você imagina isso funcionando?
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de tarefa
      options:
        - Melhoria em algo que já existe
        - Função completamente nova
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
